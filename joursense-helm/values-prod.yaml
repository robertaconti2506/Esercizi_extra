# Ambiente di produzione (namespace joursense-prod).
# Contiene SOLO le differenze rispetto a values.yaml.

# Deploy gestito da Argo CD: Application joursense-prod (joursense-ops/argocd/application-prod.yamk),
# con sincronizzazione automatica, app.image.tag viene aggiornato dall'Image Updater.

app:
  image:
    namespace: joursense-helm # l'immagine viene costruita solo li'
    tag: 3b25c722434a21060e6d0c6ba1ca3f3ca73e4f27
  resources: # il doppio delle risorse di values.yaml
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 512Mi
  autoscaling:
    minReplicas: 2 # sempre almeno 2 pod: se uno cade, l'altro serve il traffico
postgres:
  createSecret: false # secret postgres-credentials creato a parte, non dal chart
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 512Mi
backup:
  pvc:
    storage: 4Gi # piu' spazio per tenere piu' giorni di backup
  cronjob:
    retentionDays: 7 # una settimana di backup invece di 4 giorni
