app:
  name: joursense
  replicas: 1
  port: 8080
  adminEmails: "alessandro.segato@gmail.com,roberta.conti@gmail.com,roberta.conti.sou@gmail.com"
  image:
    registry: image-registry.openshift-image-registry.svc:5000
    tag: latest
    pullPolicy: Always
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  probes:
    liveness:
      path: /healthz
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    readiness:
      path: /readyz
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 3
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 50
    scaleDownStabilizationSeconds: 60

postgres:
  name: postgres
  label: database
  port: 5432
  secretName: postgres-credentials
  image: registry.redhat.io/rhel9/postgresql-16:latest
  storage: 1Gi
  database: giornalino
  user: giornalino
  password: ""
  pullPolicy: Always
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

build:
  enabled: false
  gitUri: https://github.com/robertaconti2506/Esercizi_extra.git
  gitRef: ""
  contextDir: /joursense
  dockerfilePath: Containerfile

route:
  host: ""
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

tekton:
  egress:
    enabled: true
    podLabels:
      app.kubernetes.io/managed-by: tekton-pipelines

backup:
  enabled: true
  pvc:
    name: postgres-backup
    storage: 2Gi
    storageClassName: ""
  cronjob:
    name: postgres-backup
    schedule: "0 2 * * *"
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    mountPath: /backup
monitoring:
  enabled: true
  podNotReadyFor: 2m
