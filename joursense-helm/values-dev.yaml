# Ambiente di sviluppo (namespace joursense-dev).
# Contiene SOLO le differenze rispetto a values.yaml.
# Installazione:
# helm upgrade --install joursense ./joursense-helm -n joursense-dev -f joursense-helm/values-dev.yaml --set postgres.password=...

app:
  image:
    namespace: joursense-helm      # l'immagine viene costruita solo li'
  autoscaling:
    enabled: false                 # niente HPA: una replica fissa (app.replicas: 1 di values.yaml)
  resources:                       # meta' delle risorse di values.yaml
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi

backup:
  enabled: false                   # in dev niente CronJob ne' PVC di backup

monitoring:
  enabled: false                   # niente alert in dev (e niente permesso monitoring-rules-edit)