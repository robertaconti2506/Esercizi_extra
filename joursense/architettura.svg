<svg xmlns="http://www.w3.org/2000/svg" width="680" height="580" viewBox="0 0 680 580" role="img" font-family="'Liberation Sans', Arial, Helvetica, sans-serif">
  <title>Architettura di Joursense</title>
  <desc>I colleghi aprono il sito dal browser passando dal router di OpenShift fino al pod dell'app, che legge e scrive su PostgreSQL con disco persistente. Il codice su GitHub viene costruito da una build in un'immagine salvata nell'ImageStream, usata dal pod dell'app. Il meteo arriva al browser direttamente da Open-Meteo. Le NetworkPolicy chiudono tutto il resto.</desc>
  <defs>
    <marker id="freccia" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .tit { font-size: 14px; font-weight: 700; }
      .sub { font-size: 12px; }
      .arr { stroke: #73726c; stroke-width: 1.5; fill: none; }
      .viola rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.8; }
      .viola .tit { fill: #3C3489; } .viola .sub { fill: #534AB7; }
      .verde rect { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.8; }
      .verde .tit { fill: #085041; } .verde .sub { fill: #0F6E56; }
      .grigio rect { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.8; }
      .grigio .tit { fill: #444441; } .grigio .sub { fill: #5F5E5A; }
      .nota { font-size: 12px; fill: #5F5E5A; }
      .etich { font-size: 14px; font-weight: 700; fill: #2C2C2A; }
    </style>
  </defs>

  <g class="grigio"><rect x="40" y="20" width="180" height="56" rx="8"/>
    <text class="tit" x="130" y="43" text-anchor="middle">Colleghi (browser)</text>
    <text class="sub" x="130" y="62" text-anchor="middle">login, notizie, giochi</text></g>
  <g class="grigio"><rect x="260" y="20" width="160" height="56" rx="8"/>
    <text class="tit" x="340" y="43" text-anchor="middle">Open-Meteo</text>
    <text class="sub" x="340" y="62" text-anchor="middle">previsioni meteo</text></g>
  <g class="verde"><rect x="460" y="20" width="180" height="56" rx="8"/>
    <text class="tit" x="550" y="43" text-anchor="middle">GitHub</text>
    <text class="sub" x="550" y="62" text-anchor="middle">cartella joursense/</text></g>
  <line x1="220" y1="48" x2="258" y2="48" class="arr" marker-end="url(#freccia)"/>

  <g class="viola"><rect x="40" y="110" width="180" height="56" rx="8"/>
    <text class="tit" x="130" y="133" text-anchor="middle">Router OpenShift</text>
    <text class="sub" x="130" y="152" text-anchor="middle">Route HTTPS (edge)</text></g>
  <line x1="130" y1="76" x2="130" y2="108" class="arr" marker-end="url(#freccia)"/>

  <rect x="40" y="200" width="600" height="330" rx="20" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="6 4"/>
  <text class="etich" x="290" y="230">Progetto joursense</text>
  <line x1="130" y1="166" x2="130" y2="248" class="arr" marker-end="url(#freccia)"/>

  <g class="viola"><rect x="60" y="250" width="200" height="56" rx="8"/>
    <text class="tit" x="160" y="273" text-anchor="middle">Pod app joursense</text>
    <text class="sub" x="160" y="292" text-anchor="middle">FastAPI · porta 8080</text></g>

  <line x1="530" y1="76" x2="530" y2="248" class="arr" marker-end="url(#freccia)"/>
  <g class="verde"><rect x="420" y="250" width="200" height="56" rx="8"/>
    <text class="tit" x="520" y="273" text-anchor="middle">Build</text>
    <text class="sub" x="520" y="292" text-anchor="middle">dal Containerfile</text></g>
  <line x1="520" y1="306" x2="520" y2="338" class="arr" marker-end="url(#freccia)"/>
  <g class="verde"><rect x="420" y="340" width="200" height="56" rx="8"/>
    <text class="tit" x="520" y="363" text-anchor="middle">ImageStream</text>
    <text class="sub" x="520" y="382" text-anchor="middle">immagini pronte</text></g>
  <path d="M420 368 L300 368 L300 278 L262 278" class="arr" marker-end="url(#freccia)"/>

  <line x1="160" y1="306" x2="160" y2="428" class="arr" marker-end="url(#freccia)"/>
  <g class="viola"><rect x="60" y="430" width="200" height="56" rx="8"/>
    <text class="tit" x="160" y="453" text-anchor="middle">PostgreSQL</text>
    <text class="sub" x="160" y="472" text-anchor="middle">StatefulSet postgres-0</text></g>
  <line x1="260" y1="458" x2="288" y2="458" class="arr" marker-end="url(#freccia)"/>
  <g class="grigio"><rect x="290" y="430" width="140" height="56" rx="8"/>
    <text class="tit" x="360" y="453" text-anchor="middle">Disco (PVC)</text>
    <text class="sub" x="360" y="472" text-anchor="middle">1 GiB</text></g>
  <g class="grigio"><rect x="460" y="430" width="160" height="56" rx="8"/>
    <text class="tit" x="540" y="453" text-anchor="middle">Secret</text>
    <text class="sub" x="540" y="472" text-anchor="middle">credenziali DB</text></g>

  <text class="nota" x="60" y="514">NetworkPolicy: tutto chiuso tranne router → app e app → database</text>

  <g class="viola"><rect x="40" y="548" width="12" height="12" rx="2"/></g>
  <text class="nota" x="60" y="558">Il sito in funzione</text>
  <g class="verde"><rect x="200" y="548" width="12" height="12" rx="2"/></g>
  <text class="nota" x="220" y="558">Dal codice all'immagine</text>
  <g class="grigio"><rect x="390" y="548" width="12" height="12" rx="2"/></g>
  <text class="nota" x="410" y="558">Esterni, dati e configurazione</text>
</svg>
