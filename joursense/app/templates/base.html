<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titolo %}Joursense{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23b4381f'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' font-weight='700' fill='%23fff' text-anchor='middle'%3EJ%3C/text%3E%3C/svg%3E">
</head>
<body>
  <header class="testata">
    <div class="contenitore testata-riga">
      <a class="logo" href="/">Joursense</a>
      {% if utente %}
      <nav>
        <a href="/">Notizie</a>
        <a href="/meteo">Meteo</a>
        <a href="/giochi">Giochi</a>
        <a href="/dipendente-del-mese">Dipendente del mese</a>
        <a class="bottone" href="/nuovo">Scrivi un articolo</a>
        <span class="chi" title="{{ utente.email }}">{{ utente.nome }}</span>
        <form method="post" action="/logout" class="esci">
          <button type="submit" class="link">Esci</button>
        </form>
      </nav>
      {% endif %}
    </div>
  </header>

  <main class="contenitore">
    {% block contenuto %}{% endblock %}
  </main>

  <footer class="contenitore piede">
    Il giornalino aziendale · servito dal pod <code>{{ pod }}</code>
  </footer>
</body>
</html>
