---
- name: Download Node Exporter
  ansible.builtin.get_url:
    url: "{{ monitoring_node_exporter_download_url }}"
    dest: "/tmp/node_exporter.tar.gz"
    mode: '0644'

- name: Extract Node Exporter
  ansible.builtin.unarchive:
    src: "/tmp/node_exporter.tar.gz"
    dest: "/tmp"
    remote_src: true

- name: Install Node Exporter binary
  ansible.builtin.copy:
    src: "/tmp/node_exporter-{{ monitoring_node_exporter_version }}.{{ monitoring_node_exporter_architecture }}/node_exporter"
    dest: "/usr/local/bin/node_exporter"
    owner: root
    group: root
    mode: '0755'
    remote_src: true

- name: Create Node Exporter systemd service
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: '0644'

- name: Open Node Exporter firewall port
  ansible.posix.firewalld:
    port: "{{ monitoring_node_exporter_ports[inventory_hostname] }}/tcp"
    permanent: true
    immediate: true
    state: enabled

- name: Enable and start Node Exporter
  ansible.builtin.systemd:
    name: node_exporter
    daemon_reload: true
    enabled: true
    state: started

- name: Gather service facts
  ansible.builtin.service_facts:

- name: Fail if Node Exporter is not running
  ansible.builtin.fail:
    msg: "Node Exporter service is not running"
  when: ansible_facts.services['node_exporter.service'].state != 'running'
