---
- name: Download Node Exporter
  ansible.builtin.get_url:
    url: "{{ monitoring_node_exporter_download_url }}"
    dest: "/tmp/node_exporter.tar.gz"
    mode: '0644'

- name: Extract Node Exporter
  ansible.builtin.unarchive:
    src: "/tmp/node_exporter.tar.gz"
    dest: "/tmp"
    remote_src: true

- name: Install Node Exporter binary
  ansible.builtin.copy:
    src: "/tmp/node_exporter-{{ monitoring_node_exporter_version }}.{{ monitoring_node_exporter_architecture }}/node_exporter"
    dest: "/usr/local/bin/node_exporter"
    owner: root
    group: root
    mode: '0755'
    remote_src: true

- name: Create user systemd directory
  ansible.builtin.file:
    path: /home/vagrant/.config/systemd/user
    state: directory
    owner: vagrant
    group: vagrant
    mode: '0755'

- name: Create Node Exporter user systemd service
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /home/vagrant/.config/systemd/user/node_exporter.service
    owner: vagrant
    group: vagrant
    mode: '0644'

- name: Open Node Exporter firewall port
  ansible.posix.firewalld:
    port: "{{ monitoring_node_exporter_ports[inventory_hostname] }}/tcp"
    permanent: true
    immediate: true
    state: enabled

- name: Enable and start Node Exporter
  ansible.builtin.systemd:
    name: node_exporter
    scope: user
    daemon_reload: true
    enabled: true
    state: started
  become: true
  become_user: vagrant
  environment:
    XDG_RUNTIME_DIR: /run/user/1000

- name: Enable systemd linger for vagrant
  ansible.builtin.file:
    path: /var/lib/systemd/linger/vagrant
    state: touch
    owner: root
    group: root
    mode: '0644'

- name: Enable and start Node Exporter user service
  ansible.builtin.systemd:
    name: node_exporter
    scope: user
    daemon_reload: true
    enabled: true
    state: started
  become: true
  become_user: vagrant
  environment:
    XDG_RUNTIME_DIR: /run/user/1000

- name: Check Node Exporter user service
  ansible.builtin.systemd:
    name: node_exporter
    scope: user
  become: true
  become_user: vagrant
  environment:
    XDG_RUNTIME_DIR: /run/user/1000
  register: node_exporter_service

- name: Fail if Node Exporter is not running
  ansible.builtin.fail:
    msg: "Node Exporter user service is not running"
  when: node_exporter_service.status.ActiveState != "active"
