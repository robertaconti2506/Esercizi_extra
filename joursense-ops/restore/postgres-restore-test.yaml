apiVersion: v1
kind: Pod
metadata:
  name: postgres-restore-test
  labels:
    app: postgres-restore-test
spec:
  containers:
  - name: postgres
    image: registry.redhat.io/rhel9/postgresql-16:latest
    envFrom:
    - secretRef:
        name: postgres-credentials
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    volumeMounts:
    - name: data
      mountPath: /var/lib/pgsql/data
    - name: backup
      mountPath: /backup
      readOnly: true
  volumes:
  - name: data
    emptyDir: {}
  - name: backup
    persistentVolumeClaim:
      claimName: postgres-backup