apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline-trigger-sa
  namespace: joursense-helm
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: trigger-sa-eventlistener
  namespace: joursense-helm
subjects:
  - kind: ServiceAccount
    name: pipeline-trigger-sa
    namespace: joursense-helm
roleRef:
  kind: ClusterRole
  name: tekton-triggers-eventlistener-roles
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: trigger-sa-eventlistener-clusterroles
subjects:
  - kind: ServiceAccount
    name: pipeline-trigger-sa
    namespace: joursense-helm
roleRef:
  kind: ClusterRole
  name: tekton-triggers-eventlistener-clusterroles
  apiGroup: rbac.authorization.k8s.io