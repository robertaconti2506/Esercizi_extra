# Questo file andrà eliminato dopo webhook

# Avvio manuale della pipeline joursense-pipeline
# Si lancia con: oc create -f pipelinerun.yaml

apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: joursense-pipeline-run-   # ogni avvio ha un nome nuovo (suffisso casuale)
spec:
  pipelineRef:
    name: joursense-pipeline         # la Pipeline da eseguire
  taskRunTemplate:
    serviceAccountName: pipeline    # identità con cui girano i pod della pipeline
  params:
    - name: git-url                 # repo da scaricare
      value: https://github.com/robertaconti2506/Esercizi_extra.git
    - name: git-revision            # branch da scaricare
      value: prova-pipeline
    - name: image                   # dove pushare l'immagine (registry interno, senza tag)
      value: image-registry.openshift-image-registry.svc:5000/joursense-helm/joursense
  workspaces:
    - name: source                  # disco condiviso tra i passi
      volumeClaimTemplate:          
        spec:
          accessModes:
            - ReadWriteOnce         # il disco può essere montato da un solo nodo alla volta
          resources:
            requests:
              storage: 1Gi
