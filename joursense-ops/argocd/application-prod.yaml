apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: joursense-prod
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/robertaconti2506/Esercizi_extra.git
    targetRevision: main
    path: joursense-helm
    helm:
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: joursense-prod
