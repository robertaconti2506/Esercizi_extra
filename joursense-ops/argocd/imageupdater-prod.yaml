# Regole dell'Image Updater per joursense-prod:
# quando nel registry compare un'immagine nuova (tag = SHA del commit),
# scrive il tag in values-prod.yaml con un commit su GitHub.
# La sync di prod resta manuale: l'Application joursense-prod non ha
# syncPolicy.automated, quindi dopo il commit va in OutOfSync e aspetta.

apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: joursense-prod
  namespace: openshift-gitops              # stesso namespace delle Application
spec:
  applicationRefs:
    - namePattern: "joursense-prod"        # solo prod
      images:
        - alias: joursense
          imageName: image-registry.openshift-image-registry.svc:5000/joursense-helm/joursense
          commonUpdateSettings:
            updateStrategy: newest-build   # il tag costruito più di recente
            allowTags: "regexp:^[0-9a-f]{40}$"   # solo tag SHA, ignora latest
          manifestTargets:
            helm:
              tag: app.image.tag           # il campo del chart da aggiornare
          pullSecret: pullsecret:openshift-gitops/image-updater-registry-pull
  writeBackConfig:
    method: git:secret:openshift-gitops/git-creds-joursense
    gitConfig:
      writeBackTarget: "helmvalues:/joursense-helm/values-prod.yaml"
